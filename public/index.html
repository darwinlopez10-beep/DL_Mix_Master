<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mezclador Doble Pantalla - DJ Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #e1e1e6; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #00e676; text-transform: uppercase; letter-spacing: 1px; }
    
    .decks-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 900px) { .decks-container { grid-template-columns: 1fr; } }

    .deck { background: #1e1e24; border: 1px solid #292932; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .deck-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #32323d; padding-bottom: 8px; }
    .deck-title { font-weight: bold; color: #00e676; }

    .media-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; position: relative; }
    video, iframe { width: 100%; height: 100%; border: none; display: block; }

    .controls-grid { display: flex; flex-direction: column; gap: 10px; }
    .input-row { display: flex; gap: 6px; }
    input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 4px; border: 1px solid #32323d; background: #0e0e10; color: #fff; font-size: 0.9rem; }
    
    .btn { padding: 8px 14px; background: #292932; color: #fff; border: 1px solid #3f3f4e; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn:hover { background: #3f3f4e; }
    .btn-action { background: #00e676; color: #000; border: none; }
    .btn-action:hover { background: #00c853; }
    .btn-cue { background: #ff9100; color: #000; border: none; }
    .btn-cue:hover { background: #ff6d00; }

    .file-btn { display: inline-block; padding: 8px 12px; background: #292932; color: #fff; border: 1px solid #3f3f4e; border-radius: 4px; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .file-btn input { display: none; }

    .transport-controls { display: flex; gap: 10px; margin-top: 5px; }
    .transport-controls .btn { flex: 1; padding: 12px; font-size: 1rem; }

    .slider-group { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #a0a0b0; }
    .slider-group input[type="range"] { flex: 1; accent-color: #00e676; }

    /* Crossfader Central */
    .mixer-panel { background: #18181c; border: 1px solid #292932; border-radius: 8px; padding: 15px; text-align: center; max-width: 600px; margin: 0 auto; }
    .mixer-panel h3 { font-size: 0.9rem; color: #888; margin-bottom: 10px; text-transform: uppercase; }
    .crossfader-container { display: flex; align-items: center; gap: 15px; }
    .crossfader-container span { font-weight: bold; color: #00e676; font-size: 0.9rem; }
    .crossfader-container input { flex: 1; height: 8px; accent-color: #00e676; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Control Dual de Video</h1>

  <div class="decks-container">
    <!-- DECK 1 -->
    <div class="deck" id="deck-1">
      <div class="deck-header">
        <span class="deck-title">DECK 1</span>
        <label class="file-btn">
          📂 Buscar Video Local
          <input type="file" accept="video/*" onchange="loadLocalVideo(event, 1)">
        </label>
      </div>

      <div class="media-container" id="media-box-1">
        <!-- El reproductor se inserta dinámicamente aquí -->
      </div>

      <div class="controls-grid">
        <div class="input-row">
          <input type="text" placeholder="URL o ID de YouTube" class="yt-input">
          <button class="btn btn-action" onclick="loadYouTube(1)">Cargar YT</button>
        </div>

        <div class="transport-controls">
          <button class="btn btn-action" onclick="playPause(1)">▶ / ❚❚ PLAY</button>
          <button class="btn btn-cue" onclick="cue(1)">CUE</button>
        </div>

        <div class="slider-group">
          <span>Volumen</span>
          <input type="range" id="vol-1" min="0" max="100" value="100" oninput="updateMixer()">
        </div>
      </div>
    </div>

    <!-- DECK 2 -->
    <div class="deck" id="deck-2">
      <div class="deck-header">
        <span class="deck-title">DECK 2</span>
        <label class="file-btn">
          📂 Buscar Video Local
          <input type="file" accept="video/*" onchange="loadLocalVideo(event, 2)">
        </label>
      </div>

      <div class="media-container" id="media-box-2">
        <!-- El reproductor se inserta dinámicamente aquí -->
      </div>

      <div class="controls-grid">
        <div class="input-row">
          <input type="text" placeholder="URL o ID de YouTube" class="yt-input">
          <button class="btn btn-action" onclick="loadYouTube(2)">Cargar YT</button>
        </div>

        <div class="transport-controls">
          <button class="btn btn-action" onclick="playPause(2)">▶ / ❚❚ PLAY</button>
          <button class="btn btn-cue" onclick="cue(2)">CUE</button>
        </div>

        <div class="slider-group">
          <span>Volumen</span>
          <input type="range" id="vol-2" min="0" max="100" value="100" oninput="updateMixer()">
        </div>
      </div>
    </div>
  </div>

  <!-- CROSSFADER -->
  <div class="mixer-panel">
    <h3>Crossfader (Crossover)</h3>
    <div class="crossfader-container">
      <span>DECK 1</span>
      <input type="range" id="crossfader" min="0" max="100" value="50" oninput="updateMixer()">
      <span>DECK 2</span>
    </div>
  </div>

  <script>
    // Carga dinámica de la API de YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var players = { 1: null, 2: null };
    var activeSource = { 1: null, 2: null };

    function onYouTubeIframeAPIReady() {}

    function extractVideoID(url) {
      var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      var match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    function resetMediaBox(deck) {
      if (players[deck] && typeof players[deck].destroy === 'function') {
        players[deck].destroy();
        players[deck] = null;
      }
      var box = document.getElementById('media-box-' + deck);
      box.innerHTML = ''; 
    }

    function loadYouTube(deck) {
      var deckEl = document.getElementById('deck-' + deck);
      var inputVal = deckEl.querySelector('.yt-input').value.trim();
      if (!inputVal) return;

      var videoId = extractVideoID(inputVal);
      resetMediaBox(deck);

      var box = document.getElementById('media-box-' + deck);
      var ytDiv = document.createElement('div');
      ytDiv.id = 'yt-target-' + deck;
      box.appendChild(ytDiv);

      players[deck] = new YT.Player('yt-target-' + deck, {
        videoId: videoId,
        playerVars: { 
          'autoplay': 1, 
          'controls': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': function() {
            updateMixer();
          }
        }
      });

      activeSource[deck] = 'yt';
    }

    function loadLocalVideo(event, deck) {
      var file = event.target.files[0];
      if (!file) return;

      resetMediaBox(deck);

      var box = document.getElementById('media-box-' + deck);
      var videoEl = document.createElement('video');
      videoEl.id = 'local-player-' + deck;
      videoEl.controls = true;
      videoEl.src = URL.createObjectURL(file);
      
      box.appendChild(videoEl);
      activeSource[deck] = 'local';
      
      videoEl.play();
      updateMixer();
    }

    function playPause(deck) {
      if (activeSource[deck] === 'yt' && players[deck] && players[deck].getPlayerState) {
        var state = players[deck].getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          players[deck].pauseVideo();
        } else {
          players[deck].playVideo();
        }
      } else if (activeSource[deck] === 'local') {
        var videoEl = document.getElementById('local-player-' + deck);
        if (videoEl) {
          if (videoEl.paused) {
            videoEl.play();
          } else {
            videoEl.pause();
          }
        }
      }
    }

    function cue(deck) {
      if (activeSource[deck] === 'yt' && players[deck] && players[deck].seekTo) {
        players[deck].pauseVideo();
        players[deck].seekTo(0);
      } else if (activeSource[deck] === 'local') {
        var videoEl = document.getElementById('local-player-' + deck);
        if (videoEl) {
          videoEl.pause();
          videoEl.currentTime = 0;
        }
      }
    }

    function updateMixer() {
      var v1 = document.getElementById('vol-1').value / 100;
      var v2 = document.getElementById('vol-2').value / 100;
      var xf = document.getElementById('crossfader').value / 100;

      var gain1 = v1 * Math.cos(xf * (Math.PI / 2));
      var gain2 = v2 * Math.sin(xf * (Math.PI / 2));

      // Deck 1
      if (activeSource[1] === 'yt' && players[1] && players[1].setVolume) {
        players[1].setVolume(gain1 * 100);
      } else if (activeSource[1] === 'local') {
        var v1El = document.getElementById('local-player-1');
        if (v1El) v1El.volume = gain1;
      }

      // Deck 2
      if (activeSource[2] === 'yt' && players[2] && players[2].setVolume) {
        players[2].setVolume(gain2 * 100);
      } else if (activeSource[2] === 'local') {
        var v2El = document.getElementById('local-player-2');
        if (v2El) v2El.volume = gain2;
      }
    }
  </script>
</body>
</html>
