<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master Pro - DJ Console</title>
  <style>
    :root {
      --bg-dark: #0a0d12;
      --card-bg: #141821;
      --accent-red: #ff2a5f;
      --accent-cyan: #00e5ff;
      --text-main: #ffffff;
      --text-muted: #808c9e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header {
      background: #000;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-red);
    }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: var(--accent-red); }
    
    .header-btns { display: flex; gap: 10px; }
    .btn-pro {
      background: #232b38; color: white; border: 1px solid #3a475d; padding: 8px 16px;
      font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-pro.red { background: var(--accent-red); border: none; }

    /* Modal QR */
    #qr-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--card-bg); border: 2px solid var(--accent-red); padding: 30px;
      border-radius: 12px; text-align: center; max-width: 400px;
    }
    .modal-content h2 { margin-bottom: 10px; color: var(--accent-red); }
    .modal-content p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    #qr-code-img { width: 220px; height: 220px; background: white; padding: 10px; border-radius: 8px; margin: 0 auto 15px; }

    /* Main Grid Console */
    .console-grid {
      display: grid;
      grid-template-columns: 1fr 280px 1fr;
      gap: 15px;
      padding: 15px;
      flex: 1;
      height: calc(100vh - 60px);
    }

    .deck {
      background: var(--card-bg); border-radius: 8px; padding: 15px;
      display: flex; flex-direction: column; border: 1px solid #222a38;
    }
    .deck-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: var(--accent-cyan); }
    .video-display { width: 100%; height: 220px; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 15px; }

    .controls-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn-action {
      flex: 1; padding: 12px; border: none; border-radius: 4px; font-weight: bold;
      background: #232b38; color: white; cursor: pointer;
    }
    .btn-action.play { background: #00e676; color: #000; }
    .btn-action.cue { background: #ff9100; color: #000; }

    .mixer {
      background: var(--card-bg); border-radius: 8px; padding: 15px;
      display: flex; flex-direction: column; align-items: center; border: 1px solid #222a38;
    }
    .mixer-title { font-size: 16px; font-weight: bold; color: var(--text-muted); margin-bottom: 20px; }
    .faders-container { display: flex; gap: 40px; height: 200px; align-items: center; margin-bottom: 30px; }
    .fader-group { display: flex; flex-direction: column; align-items: center; height: 100%; }
    .fader-group input[type=range] { writing-mode: bt-lr; appearance: slider-vertical; width: 8px; height: 160px; }

    .crossfader-group { width: 100%; text-align: center; }
    .crossfader-group input[type=range] { width: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="logo">DL MIX-MASTER PRO</div>
    <div class="header-btns">
      <button class="btn-pro" onclick="toggleQR()">📱 Conectar Tablet / Celular (QR)</button>
      <button class="btn-pro red" onclick="openTVWindow()">📺 Abrir Pantalla TV (HDMI)</button>
    </div>
  </header>

  <!-- Ventana emergente con el código QR para el Control Remoto -->
  <div id="qr-modal">
    <div class="modal-content">
      <h2>CONTROL REMOTO</h2>
      <p>Escanea este código QR con tu tablet o celular para buscar y controlar las canciones a distancia por Wi-Fi:</p>
      <img id="qr-code-img" src="" alt="Código QR Control Remoto">
      <button class="btn-pro" style="width: 100%; justify-content: center;" onclick="toggleQR()">CERRAR</button>
    </div>
  </div>

  <div class="console-grid">
    <!-- DECK A -->
    <div class="deck">
      <div class="deck-title">DECK A</div>
      <div class="video-display" id="player-a"></div>
      <div class="controls-row">
        <button class="btn-action cue">CUE</button>
        <button class="btn-action play">PLAY</button>
      </div>
    </div>

    <!-- MEZCLADOR CENTRAL -->
    <div class="mixer">
      <div class="mixer-title">MEZCLADOR</div>
      <div class="faders-container">
        <div class="fader-group">
          <span>VOL A</span>
          <input type="range" min="0" max="100" value="100">
        </div>
        <div class="fader-group">
          <span>VOL B</span>
          <input type="range" min="0" max="100" value="100">
        </div>
      </div>
      <div class="crossfader-group">
        <span>CROSSFADER</span>
        <input type="range" min="0" max="100" value="50">
      </div>
    </div>

    <!-- DECK B -->
    <div class="deck">
      <div class="deck-title">DECK B</div>
      <div class="video-display" id="player-b"></div>
      <div class="controls-row">
        <button class="btn-action cue">CUE</button>
        <button class="btn-action play">PLAY</button>
      </div>
    </div>
  </div>

  <script>
    function openTVWindow() {
      window.open('/tv.html', 'TVWindow', 'width=1280,height=720');
    }

    function toggleQR() {
      const modal = document.getElementById('qr-modal');
      const qrImg = document.getElementById('qr-code-img');
      const remoteUrl = window.location.protocol + '//' + window.location.host + '/remote.html';

      // Generar QR dinámico apuntando a la URL del control remoto
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(remoteUrl)}`;

      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
      } else {
        modal.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
