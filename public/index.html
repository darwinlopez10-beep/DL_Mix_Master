<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Doble Pantalla</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #00d2ff; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .screen-card { background: #1e1e1e; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .screen-card h2 { font-size: 1.2rem; color: #aaa; }

    .controls { display: flex; flex-direction: column; gap: 8px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
    button { padding: 8px 12px; background: #0088cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #00aaff; }
    
    .file-label { display: inline-block; padding: 8px 12px; background: #333; color: #fff; border-radius: 4px; cursor: pointer; text-align: center; }
    .file-label input { display: none; }

    .vol-control { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .vol-control input { flex: 1; }

    .media-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; position: relative; }
    video, iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <h1>Doble Pantalla - Video Local y YouTube</h1>

  <div class="grid">
    <div class="screen-card" id="card-1">
      <h2>Pantalla 1</h2>
      <div class="controls">
        <div class="input-group">
          <input type="text" placeholder="ID o URL de YouTube" class="yt-input">
          <button onclick="loadYouTube(1)">Cargar YT</button>
        </div>
        <label class="file-label">
          Seleccionar Video Local
          <input type="file" accept="video/*" onchange="loadLocalVideo(event, 1)">
        </label>
        <div class="vol-control">
          <span>Volumen:</span>
          <input type="range" min="0" max="100" value="100" oninput="setVolume(1, this.value)">
        </div>
      </div>
      <div class="media-container" id="container-1">
        <div id="yt-player-1"></div>
        <video id="local-player-1" controls style="display: none;"></video>
      </div>
    </div>

    <div class="screen-card" id="card-2">
      <h2>Pantalla 2</h2>
      <div class="controls">
        <div class="input-group">
          <input type="text" placeholder="ID o URL de YouTube" class="yt-input">

        </div>

          <span>Volumen:</span>
          <input type="range" min="0" max="100" value="100" oninput="setVolume(2, this.value)">
        </div>
      </div>
