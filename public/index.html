<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master DJM Console</title>
  <style>
    :root {
      --djm-bg: #0c0d10;
      --panel-bg: #15181e;
      --deck-a-color: #ff0055;
      --deck-b-color: #00d4ff;
      --gold-accent: #ffb703;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--djm-bg); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Top Bar */
    header {
      background: #050608;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--panel-bg);
    }
    .brand { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: var(--gold-accent); }
    .header-actions { display: flex; gap: 10px; }
    
    .btn-top {
      background: #222733; color: #fff; border: 1px solid #333b4d; padding: 8px 14px;
      font-size: 13px; font-weight: 700; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .btn-top.tv-btn { background: var(--deck-a-color); border: none; }

    /* Main Console Layout */
    .console-body {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: 1fr 280px;
      gap: 12px;
      padding: 12px;
      flex: 1;
      height: calc(100vh - 55px);
    }

    /* Decks Styles */
    .deck-panel {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid #262c3a;
    }
    .deck-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .deck-tag { font-size: 16px; font-weight: 900; padding: 2px 8px; border-radius: 4px; }
    .deck-a .deck-tag { background: var(--deck-a-color); color: #fff; }
    .deck-b .deck-tag { background: var(--deck-b-color); color: #000; }

    .screen-container { width: 100%; height: 180px; background: #000; border-radius: 6px; overflow: hidden; position: relative; margin-bottom: 10px; }
    .screen-container iframe, .screen-container div { width: 100%; height: 100%; }

    /* Transport Controls */
    .transport-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: auto; }
    .btn-dj {
      padding: 10px; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; color: #fff; background: #2a3142;
    }
    .btn-dj.play { background: #10b981; color: #000; }
    .btn-dj.cue { background: #f59e0b; color: #000; }

    /* Central Mixer DJM */
    .mixer-panel {
      grid-column: 2;
      grid-row: 1 / 3;
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      border: 1px solid #262c3a;
    }

    .search-section { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-section input {
      flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #333b4d; background: #0d0f14; color: #fff; font-size: 14px;
    }
    .search-section button {
      padding: 10px 16px; background: var(--gold-accent); color: #000; border: none; border-radius: 4px; font-weight: 800; cursor: pointer;
    }

    .results-list {
      flex: 1; overflow-y: auto; background: #0d0f14; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 8px;
    }
    .song-item {
      display: flex; align-items: center; justify-content: space-between; background: #191d26; padding: 8px; border-radius: 4px;
    }
    .song-item img { width: 50px; height: 38px; border-radius: 3px; object-fit: cover; }
    .song-info { flex: 1; margin: 0 10px; overflow: hidden; }
    .song-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-sub { font-size: 11px; color: var(--text-muted); }
    .song-actions { display: flex; gap: 4px; }
    .btn-load { border: none; padding: 6px 10px; border-radius: 3px; font-weight: 800; font-size: 11px; cursor: pointer; }
    .btn-load.a { background: var(--deck-a-color); color: #fff; }
    .btn-load.b { background: var(--deck-b-color); color: #000; }

    /* Mixer Hardware Controls */
    .mixer-hardware {
      height: 200px; background: #0a0b0e; border-radius: 6px; margin-top: 12px; padding: 12px; display: flex; justify-content: space-around; align-items: center;
    }
    .fader-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .fader-col input[type=range] { writing-mode: bt-lr; appearance: slider-vertical; width: 8px; height: 120px; }

    /* Modal QR */
    #qr-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-box {
      background: var(--panel-bg); border: 2px solid var(--gold-accent); padding: 25px; border-radius: 12px; text-align: center; max-width: 380px;
    }
    #qr-img { width: 200px; height: 200px; background: white; padding: 8px; border-radius: 6px; margin: 15px auto; }
  </style>
</head>
<body>

  <header>
    <div class="brand">DL MIX-MASTER DJM-PRO</div>
    <div class="header-actions">
      <button class="btn-top" onclick="toggleQR()">📱 CONTROL REMOTO QR</button>
      <button class="btn-top tv-btn" onclick="openTV()">📺 PANTALLA TV (HDMI)</button>
    </div>
  </header>

  <!-- Modal QR -->
  <div id="qr-modal">
    <div class="modal-box">
      <h3 style="color:var(--gold-accent)">ESCANEAR CONTROL REMOTO</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-top:6px">Conecta tu tablet o teléfono para buscar temas a distancia:</p>
      <img id="qr-img" src="" alt="QR">
      <button class="btn-top" style="width:100%; justify-content:center" onclick="toggleQR()">CERRAR</button>
    </div>
  </div>

  <div class="console-body">
    <!-- DECK A -->
    <div class="deck-panel deck-a" style="grid-column: 1; grid-row: 1;">
      <div class="deck-header">
        <span class="deck-tag">DECK A</span>
        <span id="title-a" style="font-size:12px; color:var(--text-muted)">Sin Cargar</span>
      </div>
      <div class="screen-container">
        <div id="player-a"></div>
      </div>
      <div class="transport-grid">
        <button class="btn-dj cue" onclick="controlDeck('A', 'cue')">CUE</button>
        <button class="btn-dj play" onclick="controlDeck('A', 'play')">PLAY</button>
        <button class="btn-dj" onclick="controlDeck('A', 'pause')">PAUSE</button>
      </div>
    </div>

    <!-- MEZCLADOR CENTRAL Y BÚSQUEDA -->
    <div class="mixer-panel">
      <div class="search-section">
        <input type="text" id="searchInput" placeholder="Buscar karaoke, artista o canción en YouTube..." onkeydown="if(event.key==='Enter') doSearch()">
        <button onclick="doSearch()">BUSCAR</button>
      </div>

      <div class="results-list" id="resultsList">
        <div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px">
          Escribe una canción arriba para explorar karaokes en YouTube
        </div>
      </div>

      <!-- Faders DJM -->
      <div class="mixer-hardware">
        <div class="fader-col">
          <span style="font-size:11px; font-weight:bold; color:var(--deck-a-color)">VOL A</span>
          <input type="range" id="volA" min="0" max="100" value="100" oninput="setVolume('A', this.value)">
        </div>
        <div class="fader-group" style="text-align:center">
          <span style="font-size:11px; font-weight:bold; color:var(--gold-accent)">CROSSFADER</span>
          <input type="range" id="crossfader" min="0" max="100" value="50" style="width:140px" oninput="setCrossfader(this.value)">
        </div>
        <div class="fader-col">
          <span style="font-size:11px; font-weight:bold; color:var(--deck-b-color)">VOL B</span>
          <input type="range" id="volB" min="0" max="100" value="100" oninput="setVolume('B', this.value)">
        </div>
      </div>
    </div>

    <!-- DECK B -->
    <div class="deck-panel deck-b" style="grid-column: 3; grid-row: 1;">
      <div class="deck-header">
        <span class="deck-tag">DECK B</span>
        <span id="title-b" style="font-size:12px; color:var(--text-muted)">Sin Cargar</span>
      </div>
      <div class="screen-container">
        <div id="player-b"></div>
      </div>
      <div class="transport-grid">
        <button class="btn-dj cue" onclick="controlDeck('B', 'cue')">CUE</button>
        <button class="btn-dj play" onclick="controlDeck('B', 'play')">PLAY</button>
        <button class="btn-dj" onclick="controlDeck('B', 'pause')">PAUSE</button>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let playerA, playerB;
    let ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

    function onYouTubeIframeAPIReady() {
      playerA = new YT.Player('player-a', {
        height: '100%', width: '100%',
        playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1 }
      });
      playerB = new YT.Player('player-b', {
        height: '100%', width: '100%',
        playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1 }
      });
    }

    async function doSearch() {
      const q = document.getElementById('searchInput').value;
      if (!q) return;
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      
      const list = document.getElementById('resultsList');
      list.innerHTML = '';

      data.forEach(song => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerHTML = `
          <img src="${song.thumbnail}" alt="thumb">
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-sub">${song.duration} - ${song.author}</div>
          </div>
          <div class="song-actions">
            <button class="btn-load a" onclick="loadVideo('A', '${song.videoId}', '${escape(song.title)}')">+ DECK A</button>
            <button class="btn-load b" onclick="loadVideo('B', '${song.videoId}', '${escape(song.title)}')">+ DECK B</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function loadVideo(deck, videoId, title) {
      if (deck === 'A') {
        playerA.loadVideoById(videoId);
        document.getElementById('title-a').innerText = unescape(title);
      } else {
        playerB.loadVideoById(videoId);
        document.getElementById('title-b').innerText = unescape(title);
      }
      // Transmitir orden por WebSocket para la ventana de TV en HDMI
      ws.send(JSON.stringify({ type: 'yt_play', deck, videoId }));
    }

    function controlDeck(deck, action) {
      const player = (deck === 'A') ? playerA : playerB;
      if (!player) return;
      if (action === 'play') player.playVideo();
      if (action === 'pause') player.pauseVideo();
      if (action === 'cue') { player.seekTo(0); player.pauseVideo(); }
    }

    function setVolume(deck, val) {
      const player = (deck === 'A') ? playerA : playerB;
      if (player && player.setVolume) player.setVolume(val);
    }

    function setCrossfader(val) {
      const volA = 100 - val;
      const volB = val;
      if (playerA && playerA.setVolume) playerA.setVolume(volA);
      if (playerB && playerB.setVolume) playerB.setVolume(volB);
      document.getElementById('volA').value = volA;
      document.getElementById('volB').value = volB;
    }

    function openTV() {
      window.open('/tv.html', 'TVWindow', 'width=1280,height=720');
    }

    function toggleQR() {
      const modal = document.getElementById('qr-modal');
      const img = document.getElementById('qr-img');
      const remoteUrl = window.location.protocol + '//' + window.location.host + '/remote.html';
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(remoteUrl)}`;
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }
  </script>
</body>
</html>
