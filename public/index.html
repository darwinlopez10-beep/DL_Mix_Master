<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DL Mix-Master DJ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0f12; color: #fff; padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #1f242d; margin-bottom: 12px; }
    .logo { font-weight: 900; font-size: 18px; color: #00e676; letter-spacing: 1px; }
    .badge { background: #1f242d; color: #38bdf8; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
    .dj-deck { background: #15181e; border: 1px solid #262c36; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .deck-title { color: #8a94a6; font-size: 11px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
    .track-title { font-size: 14px; font-weight: bold; color: #00b0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
    .jog-container { display: flex; justify-content: center; margin: 10px 0; }
    .jog-wheel { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #252b36 0%, #0d0f12 70%); border: 3px solid #00e676; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 230, 118, 0.2); }
    .jog-inner { width: 20px; height: 20px; border-radius: 50%; background: #00e676; }
    .controls-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn { padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
    .btn-play { background: #00e676; color: #000; }
    .btn-pause { background: #ffab00; color: #000; }
    .btn-stop { background: #ff1744; color: #fff; }
    .search-section { background: #15181e; border: 1px solid #262c36; border-radius: 12px; padding: 12px; flex: 1; }
    .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-box input { flex: 1; padding: 10px; background: #0d0f12; border: 1px solid #262c36; border-radius: 6px; color: #fff; font-size: 14px; }
    .search-box button { padding: 10px 14px; background: #00b0ff; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; }
    .results-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .result-item { background: #0d0f12; border: 1px solid #1f242d; border-radius: 6px; padding: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .result-img { width: 50px; height: 38px; border-radius: 4px; object-fit: cover; background: #1f242d; }
    .result-info { font-size: 12px; color: #e4e4e7; flex: 1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .btn-add { background: #00e676; color: #000; border: none; padding: 8px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .tv-btn { width: 100%; margin-top: 10px; background: #262c36; color: #38bdf8; border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div class="logo">DL MIX-MASTER</div>
    <div class="badge">ONLINE</div>
  </header>
  <div class="dj-deck">
    <div class="deck-title">REPRODUCTOR TV</div>
    <div class="track-title" id="current-song">Ninguna canción seleccionada</div>
    <div class="jog-container">
      <div class="jog-wheel"><div class="jog-inner"></div></div>
    </div>
    <div class="controls-row">
      <button class="btn btn-play" onclick="sendAction('play')">PLAY</button>
      <button class="btn btn-pause" onclick="sendAction('pause')">PAUSA</button>
      <button class="btn btn-stop" onclick="sendAction('stop')">STOP</button>
    </div>
  </div>
  <div class="search-section">
    <div class="deck-title" style="color:#00b0ff;">BUSCAR KARAOKE / MÚSICA</div>
    <div class="search-box">
      <input type="text" id="query" placeholder="Escribe canción o artista...">
      <button onclick="searchMusic()">BUSCAR</button>
    </div>
    <div class="results-list" id="results">
      <div style="text-align:center; color:#52525b; font-size:12px; padding:20px;">Escribe un tema arriba y dale a BUSCAR.</div>
    </div>
  </div>
  <button class="tv-btn" onclick="window.open('/tv.html', '_blank')">📺 Abrir Pantalla de TV</button>
  <script>
    let ws;
    function connectWS() {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
      ws.onclose = () => setTimeout(connectWS, 2000);
    }
    connectWS();

    async function fetchWithTimeout(url, timeoutMs = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        clearTimeout(id);
        return null;
      }
    }

    async function searchMusic() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div style="text-align:center; color:#38bdf8; padding:20px;">Buscando en red multiservidor...</div>';

      const endpoints = [
        `https://inv.tux.pizza/api/v1/search?q=${encodeURIComponent(q + ' karaoke')}`,
        `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q + ' karaoke')}`,
        `https://vid.puffyan.us/api/v1/search?q=${encodeURIComponent(q + ' karaoke')}`,
        `https://invidious.drgns.space/api/v1/search?q=${encodeURIComponent(q + ' karaoke')}`
      ];

      let items = null;
      for (const endpoint of endpoints) {
        items = await fetchWithTimeout(endpoint);
        if (items && Array.isArray(items) && items.length > 0) break;
      }

      resultsDiv.innerHTML = '';

      if (!items || !Array.isArray(items) || items.length === 0) {
        resultsDiv.innerHTML = '<div style="text-align:center; color:#ef4444; padding:15px;">No se pudo conectar a los servidores. Intenta nuevamente.</div>';
        return;
      }

      items.slice(0, 10).forEach(item => {
        const videoId = item.videoId || (item.url ? item.url.split('v=')[1] : null);
        if (videoId && item.title) {
          const cleanTitle = item.title.replace(/'/g, "").replace(/"/g, "");
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <img class="result-img" src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" onerror="this.src='https://via.placeholder.com/50x38/1f242d/ffffff?text=Video'">
            <div class="result-info">${item.title}</div>
            <button class="btn-add" onclick="playVideo('${videoId}', '${cleanTitle}')">▶ TV</button>
          `;
          resultsDiv.appendChild(div);
        }
      });
    }

    function playVideo(id, title) {
      document.getElementById('current-song').innerText = title;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'yt_play', videoId: id, title: title }));
      }
    }

    function sendAction(action) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'yt_control', action: action }));
      }
    }
  </script>
</body>
</html>
