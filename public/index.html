<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master DJ Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: #12151a; color: #c3c7d1; font-size: 12px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Header Bar */
    header { background: #1c2029; border-bottom: 1px solid #2d3342; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: bold; color: #00e676; font-size: 14px; letter-spacing: 1px; }
    .top-controls button { background: #2a303d; color: #fff; border: 1px solid #404b5c; padding: 4px 10px; cursor: pointer; border-radius: 3px; font-weight: bold; }
    .top-controls button:hover { background: #00e676; color: #000; }

    /* Main DJ Console Layout */
    .console-container { display: flex; flex: 1; padding: 8px; gap: 8px; background: #0b0d10; min-height: 320px; }
    
    /* Decks */
    .deck { flex: 1; background: #171a21; border: 1px solid #2a313d; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .deck-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a313d; padding-bottom: 6px; }
    .deck-title { font-weight: bold; font-size: 14px; color: #00b0ff; }
    .deck-b .deck-title { color: #ff3d00; }
    
    .jog-wheel { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #2c3240 0%, #111317 70%); border: 4px solid #3a4454; margin: 10px auto; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px #000; }
    .jog-inner { width: 30px; height: 30px; border-radius: 50%; background: #00e676; }
    .deck-b .jog-inner { background: #ff3d00; }

    .deck-controls { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
    .btn { background: #252b36; border: 1px solid #3d4657; color: #fff; padding: 6px 12px; font-weight: bold; border-radius: 3px; cursor: pointer; }
    .btn-play { background: #00c853; color: #000; }
    .btn-cue { background: #ffab00; color: #000; }

    /* Mixer */
    .mixer { width: 220px; background: #14171d; border: 1px solid #2a313d; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .eq-group { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
    .eq-knob { display: flex; flex-direction: column; align-items: center; font-size: 10px; }
    .eq-knob input { width: 80px; }
    .crossfader { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
    .crossfader input { width: 80%; }

    /* Library Section */
    .library-container { flex: 1; background: #12151a; border-top: 2px solid #2a313d; display: flex; }
    .sidebar { width: 180px; background: #171a21; border-right: 1px solid #2a313d; padding: 8px; }
    .sidebar-item { padding: 6px 8px; border-radius: 3px; cursor: pointer; margin-bottom: 2px; }
    .sidebar-item:hover, .sidebar-item.active { background: #00b0ff; color: #fff; }
    
    .main-library { flex: 1; display: flex; flex-direction: column; padding: 8px; }
    .search-bar { margin-bottom: 8px; }
    .search-bar input { width: 100%; padding: 6px; background: #1c2029; border: 1px solid #2a313d; color: #fff; border-radius: 3px; }
    
    .track-table { width: 100%; border-collapse: collapse; text-align: left; }
    .track-table th { background: #1c2029; padding: 6px; border-bottom: 1px solid #2a313d; color: #8a94a6; }
    .track-table td { padding: 6px; border-bottom: 1px solid #1c2029; }
    .track-table tr:hover { background: #252b36; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand">DL MIX-MASTER PRO</div>
    <div class="top-controls">
      <button onclick="window.open('/tv.html', '_blank')">Abrir Pantalla TV</button>
    </div>
  </header>

  <div class="console-container">
    <!-- DECK A -->
    <div class="deck deck-a">
      <div class="deck-header">
        <span class="deck-title">DECK A</span>
        <span id="title-a">Ninguna pista cargada</span>
      </div>
      <div class="jog-wheel"><div class="jog-inner"></div></div>
      <input type="file" id="file-a" accept="audio/*,video/*" style="display:none;" onchange="loadTrack('A', this)">
      <button class="btn" onclick="document.getElementById('file-a').click()">Cargar Pista A</button>
      <div class="deck-controls">
        <button class="btn btn-cue">CUE</button>
        <button class="btn btn-play" onclick="playDeck('A')">PLAY</button>
      </div>
    </div>

    <!-- MIXER CENTRAL -->
    <div class="mixer">
      <div style="font-weight:bold; color:#8a94a6;">MEZCLADOR</div>
      <div class="eq-group">
        <div class="eq-knob"><label>HI</label><input type="range" min="0" max="100" value="50"></div>
        <div class="eq-knob"><label>MID</label><input type="range" min="0" max="100" value="50"></div>
        <div class="eq-knob"><label>LOW</label><input type="range" min="0" max="100" value="50"></div>
      </div>
      <div class="crossfader">
        <label style="font-size: 10px; margin-bottom:2px;">CROSSFADER</label>
        <input type="range" min="0" max="100" value="50">
      </div>
    </div>

    <!-- DECK B -->
    <div class="deck deck-b">
      <div class="deck-header">
        <span class="deck-title">DECK B</span>
        <span id="title-b">Ninguna pista cargada</span>
      </div>
      <div class="jog-wheel"><div class="jog-inner"></div></div>
      <input type="file" id="file-b" accept="audio/*,video/*" style="display:none;" onchange="loadTrack('B', this)">
      <button class="btn" onclick="document.getElementById('file-b').click()">Cargar Pista B</button>
      <div class="deck-controls">
        <button class="btn btn-cue">CUE</button>
        <button class="btn btn-play" onclick="playDeck('B')">PLAY</button>
      </div>
    </div>
  </div>

  <!-- BIBLIOTECA DE PISTAS -->
  <div class="library-container">
    <div class="sidebar">
      <div class="sidebar-item active">📁 Pistas</div>
      <div class="sidebar-item">⭐ Listas Karaoke</div>
      <div class="sidebar-item">💻 Equipo</div>
      <div class="sidebar-item">🕒 Historial</div>
    </div>
    <div class="main-library">
      <div class="search-bar">
        <input type="text" placeholder="Buscar artista, canción o karaoke...">
      </div>
      <table class="track-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Artista</th>
            <th>Duración</th>
          </tr>
        </thead>
        <tbody id="track-list">
          <tr>
            <td>1</td>
            <td>Selecciona "Cargar Pista" en DECK A o B para reproducir</td>
            <td>Local</td>
            <td>--:--</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

    function loadTrack(deck, input) {
      if (input.files && input.files[0]) {
        const fileName = input.files[0].name;
        document.getElementById(`title-${deck.toLowerCase()}`).innerText = fileName;
      }
    }

    function playDeck(deck) {
      const title = document.getElementById(`title-${deck.toLowerCase()}`).innerText;
      ws.send(JSON.stringify({ type: 'play', deck: deck, title: title }));
    }
  </script>
</body>
</html>
