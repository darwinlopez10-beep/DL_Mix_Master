<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DL Mix-Master DJ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0f12; color: #fff; padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #1f242d; margin-bottom: 12px; }
    .logo { font-weight: 900; font-size: 18px; color: #00e676; letter-spacing: 1px; }
    .badge { background: #1f242d; color: #38bdf8; padding: 4px 8px; border-radius: 12px; font-size: 11px; }

    /* Deck DJ Style */
    .dj-deck { background: #15181e; border: 1px solid #262c36; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .deck-title { color: #8a94a6; font-size: 11px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
    .track-title { font-size: 14px; font-weight: bold; color: #00b0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }

    .jog-container { display: flex; justify-content: center; margin: 10px 0; }
    .jog-wheel { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #252b36 0%, #0d0f12 70%); border: 3px solid #00e676; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 230, 118, 0.2); }
    .jog-inner { width: 25px; height: 25px; border-radius: 50%; background: #00e676; }

    .controls-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn { padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
    .btn-play { background: #00e676; color: #000; }
    .btn-pause { background: #ffab00; color: #000; }
    .btn-stop { background: #ff1744; color: #fff; }

    /* Buscador */
    .search-section { background: #15181e; border: 1px solid #262c36; border-radius: 12px; padding: 12px; flex: 1; }
    .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-box input { flex: 1; padding: 10px; background: #0d0f12; border: 1px solid #262c36; border-radius: 6px; color: #fff; font-size: 14px; }
    .search-box button { padding: 10px 14px; background: #00b0ff; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; }

    .results-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .result-item { background: #0d0f12; border: 1px solid #1f242d; border-radius: 6px; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
    .result-info { font-size: 12px; color: #e4e4e7; flex: 1; margin-right: 8px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .btn-add { background: #00e676; color: #000; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .tv-btn { width: 100%; margin-top: 10px; background: #262c36; color: #38bdf8; border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="logo">DL MIX-MASTER</div>
    <div class="badge">ONLINE</div>
  </header>

  <!-- DECK PRINCIPAL -->
  <div class="dj-deck">
    <div class="deck-title">DECK REPRODUCTOR</div>
    <div class="track-title" id="current-song">Ninguna canción seleccionada</div>
    
    <div class="jog-container">
      <div class="jog-wheel"><div class="jog-inner"></div></div>
    </div>

    <div class="controls-row">
      <button class="btn btn-play" onclick="sendAction('play')">PLAY</button>
      <button class="btn btn-pause" onclick="sendAction('pause')">PAUSA</button>
      <button class="btn btn-stop" onclick="sendAction('stop')">STOP</button>
    </div>
  </div>

  <!-- BUSCADOR INTERNET -->
  <div class="search-section">
    <div class="deck-title" style="color:#00b0ff;">BUSCAR KARAOKE / MÚSICA EN INTERNET</div>
    <div class="search-box">
      <input type="text" id="query" placeholder="Ej: Salsa karaoke, Romeo Santos...">
      <button onclick="searchMusic()">BUSCAR</button>
    </div>

    <div class="results-list" id="results">
      <div style="text-align:center; color:#52525b; font-size:12px; padding:20px;">
        Ingresa el nombre de una canción o karaoke arriba para buscar en internet.
      </div>
    </div>
  </div>

  <button class="tv-btn" onclick="window.open('/tv.html', '_blank')">📺 Abrir pantalla de TV (Para la laptop/TV)</button>

  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    let currentVideoId = '';

    function searchMusic() {
      const q = document.getElementById('query').value;
      if (!q) return;

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div style="text-align:center; color:#38bdf8; padding:20px;">Buscando en internet...</div>';

      // Uso de motor de búsqueda libre de YouTube sin API Key
      fetch(`https://pipe-api.vercel.app/api/search?q=${encodeURIComponent(q + ' karaoke')}`)
        .then(res => res.json())
        .then(data => {
          resultsDiv.innerHTML = '';
          const items = data.results || data.items || [];
          if (items.length === 0) {
            resultsDiv.innerHTML = '<div style="text-align:center; color:#ef4444; padding:10px;">No se encontraron canciones.</div>';
            return;
          }

          items.slice(0, 10).forEach(item => {
            const title = item.title || item.name;
            const videoId = item.id || (item.url ? item.url.split('v=')[1] : '');

            if (videoId) {
              const div = document.createElement('div');
              div.className = 'result-item';
              div.innerHTML = `
                <div class="result-info">${title}</div>
                <button class="btn-add" onclick="playVideo('${videoId}', '${escape(title)}')">▶ TV</button>
              `;
              resultsDiv.appendChild(div);
            }
          });
        })
        .catch(err => {
          // Fallback a reproductor directo
          resultsDiv.innerHTML = `
            <div class="result-item">
              <div class="result-info">Reproducir Búsqueda Directa: "${q}"</div>
              <button class="btn-add" onclick="playDirect('${q}')">▶ REPRODUCIR</button>
            </div>`;
        });
    }

    function playVideo(id, title) {
      const cleanTitle = unescape(title);
      document.getElementById('current-song').innerText = cleanTitle;
      currentVideoId = id;

      ws.send(JSON.stringify({
        type: 'yt_play',
        videoId: id,
        title: cleanTitle
      }));
    }

    function sendAction(action) {
      ws.send(JSON.stringify({
        type: 'yt_control',
        action: action
      }));
    }
  </script>
</body>
</html>
