<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DL Mix-Master Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #27272a; }
    h1 { color: #22c55e; font-size: 22px; letter-spacing: 1px; }
    p.subtitle { color: #a1a1aa; font-size: 12px; margin-top: 4px; }

    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .file-input-wrapper { position: relative; margin-bottom: 12px; }
    .btn-file { width: 100%; padding: 14px; background: #27272a; border: 2px dashed #52525b; border-radius: 8px; color: #e4e4e7; font-size: 14px; text-align: center; font-weight: 600; cursor: pointer; display: block; }
    input[type="file"] { display: none; }

    .track-info { background: #09090b; padding: 10px 12px; border-radius: 6px; font-size: 13px; color: #a1a1aa; word-break: break-all; margin-bottom: 12px; }
    .track-info strong { color: #fff; }

    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-play { background: #22c55e; color: #000; }
    .btn-pause { background: #eab308; color: #000; }
    .btn-stop { background: #ef4444; color: #fff; grid-column: span 2; }

    .tv-link-btn { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>DL MIX-MASTER</h1>
    <p class="subtitle">Control Remoto de Karaoke y Video</p>
  </header>

  <!-- CONTROL DE REPRODUCCIÓN -->
  <div class="card">
    <div class="card-title">
      <span>REPRODUCTOR PRINCIPAL</span>
      <span id="status-badge" style="font-size:10px; background:#22c55e; color:#000; padding:2px 6px; border-radius:10px;">EN LÍNEA</span>
    </div>

    <div class="file-input-wrapper">
      <label for="video-file" class="btn-file">📁 Seleccionar Video MP4 / Audio</label>
      <input type="file" id="video-file" accept="video/mp4,video/webm,audio/*" onchange="handleFileSelect(this)">
    </div>

    <div class="track-info">
      Archivo: <strong id="current-filename">Ningún archivo cargado</strong>
    </div>

    <div class="control-grid">
      <button class="btn btn-play" onclick="sendControl('play')">▶ REPRODUCIR</button>
      <button class="btn btn-pause" onclick="sendControl('pause')">⏸ PAUSAR</button>
      <button class="btn btn-stop" onclick="sendControl('stop')">⏹ DETENER</button>
    </div>
  </div>

  <!-- ENLACE PANTALLA TV -->
  <div class="card">
    <div class="card-title">ENLACE PARA EL TELEVISOR</div>
    <p style="font-size: 12px; color: #a1a1aa; margin-bottom: 10px;">
      Abre esta dirección en el navegador de la TV donde proyectarás los videos:
    </p>
    <div style="background:#09090b; padding:10px; border-radius:6px; font-family:monospace; font-size:12px; color:#38bdf8; text-align:center; word-break:break-all;">
      https://dl-mix-master.onrender.com/tv.html
    </div>
    <button class="tv-link-btn" onclick="window.open('/tv.html', '_blank')">Abrir Pantalla TV aquí (Prueba)</button>
  </div>

  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    let selectedFileUrl = null;
    let selectedFileName = '';

    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        selectedFileName = file.name;
        document.getElementById('current-filename').innerText = selectedFileName;
        
        // Crear URL local para enviar la transmisión del archivo
        selectedFileUrl = URL.createObjectURL(file);
      }
    }

    function sendControl(action) {
      if (!selectedFileUrl && action === 'play') {
        alert('Por favor selecciona un archivo MP4 o de audio primero.');
        return;
      }

      ws.send(JSON.stringify({
        type: 'media_control',
        action: action,
        title: selectedFileName,
        url: selectedFileUrl
      }));
    }
  </script>
</body>
</html>
