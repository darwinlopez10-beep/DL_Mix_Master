<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video y Música</title>
    <style>
        /* Estilos generales para centrar y dar buen aspecto */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Contenedor del video optimizado */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Estilo para el reproductor de audio */
        audio {
            width: 100%;
            margin-top: 10px;
            outline: none;
        }

        h2 {
            margin-bottom: 15px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Reproductor de la FIESTA</h2>

        <div class="video-box">
            <video autoplay muted loop playsinline controls>
                <source src="TU_ENLACE_O_RUTA_DE_VIDEO.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>

        <div>
            <p>Escucha la pista aquí:</p>
            <audio controls autoplay>
                <source src="TU_ENLACE_O_RUTA_DE_AUDIO.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </div>

</body>
</html>
