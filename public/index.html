<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>Karaoke Station Pro + YouTube</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#080b12;--panel:#111722;--panel2:#171e2b;--border:#273143;
  --text:#f4f7fb;--muted:#8e9bad;--accent:#e63946;--accent2:#ff5964;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;height:100vh;overflow:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer;color:var(--text)}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr 82px}
header{display:flex;align-items:center;gap:18px;padding:0 20px;background:#0d121b;border-bottom:1px solid var(--border)}
.logo{font-size:21px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.logo span{color:var(--accent)}
.search{flex:1;max-width:500px;position:relative}
.search input{width:100%;background:#171e2b;border:1px solid var(--border);border-radius:9px;color:white;padding:11px 15px;outline:none}
.search input:focus{border-color:var(--accent)}
.header-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{background:#171e2b;border:1px solid var(--border);border-radius:8px;padding:9px 12px}
.icon-btn:hover{background:#202a3b}
.main{min-height:0;display:grid;grid-template-columns:310px 1fr 310px}
.sidebar{background:var(--panel);border-right:1px solid var(--border);min-height:0;overflow:auto}
.rightbar{border-left:1px solid var(--border);border-right:0}
.side-title{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px;font-weight:700}
.count{color:var(--muted);font-size:12px}
.song{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;display:flex;gap:11px;align-items:center}
.song:hover{background:#171e2b}
.song.active{background:#25151a;border-left:3px solid var(--accent);padding-left:11px}
.thumb{width:58px;height:42px;border-radius:5px;background:#252e3d;display:grid;place-items:center;color:#77849a;flex:none;font-size:18px}
.song-info{min-width:0}
.song-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:35px 20px;text-align:center;color:var(--muted);line-height:1.6}
.player-area{min-width:0;min-height:0;display:flex;flex-direction:column;background:#05070b}
.video-wrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
video, #ytPlayerContainer{width:100%;height:100%;background:#000;display:block;position:absolute;top:0;left:0}
#ytPlayerContainer {display:none; border:none;}
.no-video{position:absolute;text-align:center;color:#657187;pointer-events:none;z-index:5}
.no-video .mic{font-size:55px;margin-bottom:12px}
.no-video h2{margin:0;color:#aab4c4;font-size:20px}
.no-video p{font-size:13px}
.now-playing{padding:13px 18px;background:#0d121b;border-top:1px solid var(--border)}
.now-title{font-weight:700}.now-artist{color:var(--muted);font-size:13px;margin-top:3px}
.right-content{padding:0 16px 20px}
.info-card{background:#171e2b;border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:14px}
.info-card h3{font-size:14px;margin:0 0 12px}
.info-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.info-row:last-child{border-bottom:0}
.info-row b{color:var(--text)}
.file-input{display:none}
.upload{display:block;text-align:center;background:var(--accent);padding:11px;border-radius:8px;font-weight:700;margin-bottom:10px}
.upload:hover{background:var(--accent2)}
.qr-box{background:#fff;padding:12px;border-radius:8px;text-align:center;margin-top:10px}
#qrcode img{display:block;margin:0 auto}
footer{background:#0d121b;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 18px;gap:20px}
.progress-area{display:flex;align-items:center;gap:10px}
.time{font-size:11px;color:var(--muted);width:42px;text-align:center}
input[type=range]{accent-color:var(--accent);width:100%;cursor:pointer}
.controls{display:flex;justify-content:center;align-items:center;gap:9px}
.ctrl{width:40px;height:40px;border-radius:50%;background:#1a2230;border:1px solid var(--border);font-size:16px}
.ctrl:hover{background:#263247}
.play{width:50px;height:50px;background:var(--accent);font-size:20px}
.play:hover{background:var(--accent2)}
.footer-right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.volume{display:flex;align-items:center;gap:8px;width:150px}
#volume{width:90px}

.remote-mode { display:none; padding:20px; text-align:center; background:var(--bg); height:100vh; overflow-y:auto; }
</style>
</head>
<body>

<div class="app" id="desktopApp">
<header>
  <div class="logo">🎤 <span>Karaoke</span> Station</div>
  <div class="search">
    <input id="search" type="search" placeholder="Busca local o pega enlace/término de YouTube...">
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="clearBtn" title="Limpiar">🗑</button>
    <button class="icon-btn" id="fsBtn" title="Pantalla completa">⛶</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="side-title"><span>Biblioteca</span><span class="count" id="count">0 canciones</span></div>
    <label class="upload" for="filePicker">＋ Agregar videos locales</label>
    <input id="filePicker" class="file-input" type="file" accept="video/*" multiple>
    
    <button class="upload" id="addYtBtn" style="background:#202a3b;margin-top:5px;">🔍 Buscar/Añadir YouTube</button>
    
    <div id="songList"></div>
    <div id="empty
