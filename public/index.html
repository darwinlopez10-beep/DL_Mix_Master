<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Station - López Equipment</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            gap: 20px;
        }

        /* Contenedor del video principal */
        .video-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Controles y Panel de Estado */
        .control-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .qr-section {
            text-align: center;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .qr-section p {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Karaoke Station</h1>
        <p>Conéctate y controla tu música y videos al instante</p>
    </header>

    <div class="main-container">
        <!-- Visualizador de Video -->
        <div class="video-card">
            <div class="video-container">
                <video id="karaokeVideo" controls playsinline>
                    <!-- Cambia esta ruta por tu archivo de video o enlace -->
                    <source src="" type="video/mp4">
                    Tu navegador no soporta la reproducción de video.
                </video>
            </div>
        </div>

        <!-- Panel de Control Principal -->
        <div class="control-panel">
            <div class="panel-row">
                <input type="text" id="videoUrlInput" placeholder="Pega el enlace del video o ruta local (.mp4)...">
                <button onclick="cargarVideo()">Cargar Video</button>
            </div>
            <div class="panel-row">
                <span id="connectionStatus" style="color: #38bdf8; font-size: 0.9rem;">Estado P2P: Listo para conectar</span>
            </div>
        </div>

        <!-- Sección de Control Remoto (QR / PeerJS) -->
        <div class="qr-section">
            <p>Escanea para controlar desde tu teléfono (Remoto)</p>
            <div id="qrcode" style="display:inline-block; background: #fff; padding: 10px; border-radius: 6px;">
                <!-- Espacio para tu QR dinámico -->
                <span style="color: #000; font-size: 0.8rem;">[Código QR de Conexión]</span>
            </div>
        </div>
    </div>

    <script>
        // Función básica para cargar el video dinámicamente desde el input
        function cargarVideo() {
            const inputVal = document.getElementById('videoUrlInput').value;
            const videoElement = document.getElementById('karaokeVideo');
            
            if(inputVal.trim() !== "") {
                videoElement.src = inputVal;
                videoElement.load();
                videoElement.play().catch(error => {
                    console.log("Reproducción automática bloqueada o ruta inválida:", error);
                });
            } else {
                alert("Por favor ingresa una ruta o enlace de video válido.");
            }
        }
    </script>

</body>
</html>
