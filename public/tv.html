<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master - TV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; cursor: none; }
    
    #standby {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00e676;
      text-align: center;
      background: radial-gradient(circle, #1a2332 0%, #0d0f12 100%);
    }
    #standby h1 { font-size: 48px; margin-bottom: 10px; font-weight: 900; letter-spacing: 2px; }
    #standby p { font-size: 20px; color: #8a94a6; }

    #player-container { width: 100vw; height: 100vh; display: none; background: #000; }
    #player { width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>

  <div id="standby">
    <h1>DL MIX-MASTER</h1>
    <p>Conectado. Busca una canción desde tu teléfono para iniciar la rumba.</p>
  </div>

  <div id="player-container">
    <div id="player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let ws;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'showinfo': 0,
          'rel': 0,
          'modestbranding': 1,
          'iv_load_policy': 3,
          'disablekb': 1,
          'fs': 0,
          'cc_load_policy': 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      connectWS();
    }

    function connectWS() {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'yt_play') {
          document.getElementById('standby').style.display = 'none';
          document.getElementById('player-container').style.display = 'block';
          player.loadVideoById(data.videoId);
          player.playVideo();
        }

        if (data.type === 'yt_control') {
          if (data.action === 'play') player.playVideo();
          if (data.action === 'pause') player.pauseVideo();
          if (data.action === 'stop') {
            player.stopVideo();
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('standby').style.display = 'flex';
          }
        }
      };

      ws.onclose = () => setTimeout(connectWS, 2000);
    }
  </script>
</body>
</html>
