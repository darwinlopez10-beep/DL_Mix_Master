<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DL Mix-Master - Salida TV Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: pointer; }
    
    .video-container { position: relative; width: 100vw; height: 100vh; }
    
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: none; transition: opacity 0.1s ease-out;
    }
    #screen-a { z-index: 1; opacity: 1; }
    #screen-b { z-index: 2; opacity: 0; }
  </style>
</head>
<body onclick="toggleFullscreen()">

  <div class="video-container">
    <div id="screen-a" class="screen"></div>
    <div id="screen-b" class="screen"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let playerA, playerB;
    let ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

    function onYouTubeIframeAPIReady() {
      playerA = new YT.Player('screen-a', { height: '100%', width: '100%', playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1 } });
      playerB = new YT.Player('screen-b', { height: '100%', width: '100%', playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1 } });
    }

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'yt_play') {
          if (data.deck === 'A' && playerA && playerA.loadVideoById) playerA.loadVideoById(data.videoId);
          if (data.deck === 'B' && playerB && playerB.loadVideoById) playerB.loadVideoById(data.videoId);
        }
        if (data.type === 'crossfade_video') {
          // Ajusta la transparencia (opacity) del video B para mezclar los videos suavemente
          const opacityB = data.value / 100;
          document.getElementById('screen-b').style.opacity = opacityB;
        }
      } catch(e) {}
    };

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
