<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master TV Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: sans-serif; }
    
    #video-player { width: 100vw; height: 100vh; object-fit: contain; display: none; }
    .standby-screen { text-align: center; }
    h1 { font-size: 3rem; color: #22c55e; margin-bottom: 1rem; }
    p { font-size: 1.5rem; color: #a1a1aa; }
  </style>
</head>
<body>

  <div id="standby" class="standby-screen">
    <h1>DL MIX-MASTER</h1>
    <p>Esperando video desde el celular...</p>
  </div>

  <video id="video-player" controls autoplay></video>

  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    const video = document.getElementById('video-player');
    const standby = document.getElementById('standby');

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'media_control') {
        if (data.action === 'play') {
          if (data.url && video.src !== data.url) {
            video.src = data.url;
          }
          standby.style.display = 'none';
          video.style.display = 'block';
          video.play();
        } else if (data.action === 'pause') {
          video.pause();
        } else if (data.action === 'stop') {
          video.pause();
          video.currentTime = 0;
          video.style.display = 'none';
          standby.style.display = 'block';
        }
      }
    };
  </script>
</body>
</html>
