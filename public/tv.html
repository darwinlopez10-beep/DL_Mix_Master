<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master - TV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    
    #standby {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00e676;
      text-align: center;
      background: radial-gradient(circle, #1a2332 0%, #0d0f12 100%);
      padding: 20px;
    }
    #standby h1 { font-size: 42px; margin-bottom: 10px; font-weight: 900; letter-spacing: 2px; }
    #standby p { font-size: 18px; color: #8a94a6; margin-bottom: 20px; }

    .cast-btn {
      background: #00b0ff;
      color: #000;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 176, 255, 0.3);
    }
    .cast-btn:hover { background: #38bdf8; }

    #player-container { width: 100vw; height: 100vh; display: none; background: #000; }
    #player { width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>

  <div id="standby">
    <h1>DL MIX-MASTER</h1>
    <p>Conectado. Busca una canción desde tu teléfono para iniciar la rumba.</p>
    
    <!-- BOTÓN DE TRANSMISIÓN A SmartTV / MIRACAST / CHROMECAST -->
    <button class="cast-btn" onclick="startCasting()">
      📺 Transmitir Pantalla / TV Inalámbrico
    </button>
  </div>

  <div id="player-container">
    <div id="player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let ws;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'showinfo': 0,
          'rel': 0,
          'modestbranding': 1,
          'iv_load_policy': 3,
          'disablekb': 1,
          'fs': 0,
          'cc_load_policy': 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      connectWS();
    }

    // Función para activar el selector de pantallas en Linux
    async function startCasting() {
      if (navigator.share) {
        try {
          await navigator.share({ title: 'DL Mix-Master TV', url: window.location.href });
        } catch (e) {}
      } else if (window.chrome && window.chrome.cast) {
        // En Chrome Linux abre el menú de Cast nativo
        window.print(); 
      } else {
        alert("Instrucción en Linux:\nHaz clic derecho en la página > Selecciona 'Transmitir...' o 'Cast' para conectar tu Smart TV por Wi-Fi.");
      }
    }

    function connectWS() {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'yt_play') {
          document.getElementById('standby').style.display = 'none';
          document.getElementById('player-container').style.display = 'block';
          player.loadVideoById(data.videoId);
          player.playVideo();
        }

        if (data.type === 'yt_control') {
          if (data.action === 'play') player.playVideo();
          if (data.action === 'pause') player.pauseVideo();
          if (data.action === 'stop') {
            player.stopVideo();
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('standby').style.display = 'flex';
          }
        }
      };

      ws.onclose = () => setTimeout(connectWS, 2000);
    }
  </script>
</body>
</html>
