<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master - TV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    
    #standby {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00e676;
      text-align: center;
      background: radial-gradient(circle, #1a2332 0%, #0d0f12 100%);
      padding: 20px;
    }
    #standby h1 { font-size: 42px; margin-bottom: 10px; font-weight: 900; letter-spacing: 2px; }
    #standby p { font-size: 18px; color: #8a94a6; margin-bottom: 25px; }

    .cast-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    google-cast-launcher {
      width: 60px;
      height: 60px;
      cursor: pointer;
      background-color: #00b0ff;
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 176, 255, 0.4);
    }

    .info-text {
      font-size: 14px;
      color: #38bdf8;
      max-width: 400px;
      line-height: 1.4;
    }

    #player-container { width: 100vw; height: 100vh; display: none; background: #000; }
    #player { width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>

  <div id="standby">
    <h1>DL MIX-MASTER</h1>
    <p>Conectado. Busca una canción desde tu teléfono para iniciar la rumba.</p>
    
    <div class="cast-container">
      <p class="info-text">Toca el ícono para buscar e iniciar transmisión a tu Android TV / Google TV / Roku:</p>
      <!-- ÍCONO NATIVO DE BÚSQUEDA DE TELEVISORES EN LA RED -->
      <google-cast-launcher></google-cast-launcher>
    </div>
  </div>

  <div id="player-container">
    <div id="player"></div>
  </div>

  <!-- Carga la librería nativa de Google Cast para enviar señal directa a TVs -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let ws;

    // Inicializar el receptor de Google Cast para Smart TVs
    window.__onGCastApiAvailable = function(isAvailable) {
      if (isAvailable) {
        cast.framework.CastContext.getInstance().setOptions({
          receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
        });
      }
    };

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'showinfo': 0,
          'rel': 0,
          'modestbranding': 1,
          'iv_load_policy': 3,
          'disablekb': 1,
          'fs': 0,
          'cc_load_policy': 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      connectWS();
    }

    function connectWS() {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'yt_play') {
          document.getElementById('standby').style.display = 'none';
          document.getElementById('player-container').style.display = 'block';
          player.loadVideoById(data.videoId);
          player.playVideo();
        }

        if (data.type === 'yt_control') {
          if (data.action === 'play') player.playVideo();
          if (data.action === 'pause') player.pauseVideo();
          if (data.action === 'stop') {
            player.stopVideo();
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('standby').style.display = 'flex';
          }
        }
      };

      ws.onclose = () => setTimeout(connectWS, 2000);
    }
  </script>
</body>
</html>
