<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Mix-Master TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    #player { width: 100vw; height: 100vh; pointer-events: none; }
    .standby { text-align: center; }
    h1 { font-size: 3rem; color: #00e676; margin-bottom: 10px; }
    p { color: #8a94a6; font-size: 1.5rem; }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <div id="standby" class="standby">
    <h1>DL MIX-MASTER</h1>
    <p>Conectado. Busca una canción desde tu teléfono para iniciar la rumba.</p>
  </div>

  <div id="player" style="display:none;"></div>

  <script>
    let player;
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1 },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.type === 'yt_play') {
          document.getElementById('standby').style.display = 'none';
          document.getElementById('player').style.display = 'block';
          player.loadVideoById(data.videoId);
          player.playVideo();
        } else if (data.type === 'yt_control') {
          if (data.action === 'play') player.playVideo();
          if (data.action === 'pause') player.pauseVideo();
          if (data.action === 'stop') {
            player.stopVideo();
            document.getElementById('player').style.display = 'none';
            document.getElementById('standby').style.display = 'block';
          }
        }
      };
    }
  </script>
</body>
</html>
